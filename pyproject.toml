[project]
name = "nfl-model"
version = "0.1.0"
description = "NFL prediction & betting model. Free-data, walk-forward backtested 2014-2025, conviction-tier filtered, teaser/alt-line aware."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Shamgar Benieman" }]
license = { text = "MIT" }
keywords = ["nfl", "football", "betting", "machine-learning", "epa", "nflverse"]

dependencies = [
    # ----- Core scientific stack -----
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.16",
    "scipy>=1.13",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    # ----- ML / stats -----
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "statsmodels>=0.14",
    "optuna>=4.0",
    "shap>=0.46",
    "joblib>=1.4",
    # ----- NFL data -----
    "nflreadpy>=0.1.0",
    # ----- HTTP / scraping / caching -----
    "httpx>=0.27",
    "requests>=2.32",
    "requests-cache>=1.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "tenacity>=9.0",
    # ----- Config / logging -----
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "loguru>=0.7",
    "typer>=0.12",
    "rich>=13.8",
    "python-dotenv>=1.0",
    # ----- Date / timezone -----
    "python-dateutil>=2.9",
    "pytz>=2024.2",
    # ----- Plotting / notebooks -----
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.24",
    # ----- Web app -----
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]
desktop = [
    "pywebview>=6.2",
]

[project.scripts]
nfl-model = "nfl_model.cli:app"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0915"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
